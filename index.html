<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learner's Permit Practice Test</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --success: #16a34a;
            --error: #dc2626;
            --bg: #f8fafc;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .quiz-container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
        }
        h1 { color: var(--primary); text-align: center; margin-top: 0; }
        .progress { color: #64748b; font-weight: bold; margin-bottom: 20px; }
        .quiz-image {
            max-width: 100%;
            height: auto;
            max-height: 200px;
            display: block;
            margin: 0 auto 20px auto;
            border-radius: 6px;
        }
        .question { font-size: 1.2rem; font-weight: 600; margin-bottom: 20px; }
        .options { display: grid; gap: 12px; }
        .btn {
            background: #f1f5f9;
            border: 2px solid #e2e8f0;
            padding: 14px;
            border-radius: 8px;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:hover { background: #e2e8f0; border-color: #cbd5e1; }
        .correct { background: #dcfce7 !important; border-color: var(--success) !important; color: #14532d; }
        .wrong { background: #fee2e2 !important; border-color: var(--error) !important; color: #7f1d1d; }
        .next-btn {
            margin-top: 20px;
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            display: none;
        }
        .score-screen { text-align: center; display: none; }
        /* Footer styling */
        .footer {
            margin-top: 18px;
            text-align: center;
            color: #94a3b8;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="quiz-box">
        <div class="progress">Question <span id="current-idx">1</span> of <span id="total-qty">10</span></div>
        <img id="q-image" class="quiz-image" src="" alt="Road Sign/Diagram" style="display:none;">
        <div id="q-text" class="question">Loading question...</div>
        <div id="options-box" class="options"></div>
        <button id="next-button" class="next-btn" onclick="nextQuestion()">Next Question</button>
    </div>

    <div id="result-box" class="score-screen">
        <h2>Test Complete!</h2>
        <p style="font-size: 1.5rem;">Your Score: <span id="final-score">0</span>%</p>
        <p id="pass-fail-msg"></p>
        <button class="next-btn" style="display:block;" onclick="startQuiz()">Try Again</button>
    </div>

    <!-- Footer showing last modified time for questions.json -->
    <div id="page-footer" class="footer">Questions last modified: <span id="last-modified">Loading…</span></div>
</div>

<script>
// QUESTIONS ARE LOADED FROM questions.json (instead of an inline array)
let questionBank = [];
let sharedQuestions = [];
let currentQuestionIndex = 0;
let score = 0;
const QUESTIONS_PER_TEST = 20; // Number of random questions to show per attempt

// Load questions.json and then start the quiz
async function loadQuestionsAndStart() {
    try {
        const resp = await fetch('questions.json', { cache: "no-cache" });
        if (!resp.ok) throw new Error(`Failed to load questions.json: ${resp.status} ${resp.statusText}`);
        const data = await resp.json();

        if (!Array.isArray(data) || data.length === 0) {
            throw new Error('questions.json must contain a non-empty array of questions.');
        }

        questionBank = data;

        // If you want to ensure QUESTIONS_PER_TEST is not larger than available questions:
        if (QUESTIONS_PER_TEST > questionBank.length) {
            console.warn(`QUESTIONS_PER_TEST (${QUESTIONS_PER_TEST}) is greater than available questions (${questionBank.length}). Adjusting to use all available questions.`);
        }

        startQuiz();
    } catch (err) {
        // Show a friendly error in the page if loading fails
        console.error(err);
        document.getElementById('q-text').innerText = 'Failed to load questions. Please ensure questions.json is present and valid.';
        document.getElementById('options-box').innerHTML = '';
        document.getElementById('next-button').style.display = 'none';
    }
}

// 2. QUIZ ENGINE LOGIC
function startQuiz() {
    score = 0;
    currentQuestionIndex = 0;
    
    // Completely randomize the question bank pool
    const shuffledPool = [...questionBank].sort(() => 0.5 - Math.random());
    
    // If QUESTIONS_PER_TEST > bank size, slice will just return the available items
    sharedQuestions = shuffledPool.slice(0, QUESTIONS_PER_TEST);
    
    document.getElementById("quiz-box").style.display = "block";
    document.getElementById("result-box").style.display = "none";
    document.getElementById("total-qty").innerText = sharedQuestions.length;
    
    showQuestion();
}

function showQuestion() {
    document.getElementById("next-button").style.display = "none";
    const currentQ = sharedQuestions[currentQuestionIndex];
    
    document.getElementById("current-idx").innerText = currentQuestionIndex + 1;
    document.getElementById("q-text").innerText = currentQ.question;
    
    // Handle Image Display
    const imgElement = document.getElementById("q-image");
    if (currentQ.image) {
        imgElement.src = currentQ.image;
        imgElement.style.display = "block";
    } else {
        imgElement.style.display = "none";
    }
    
    // Render Options Buttons
    const optionsBox = document.getElementById("options-box");
    optionsBox.innerHTML = "";
    
    currentQ.options.forEach((option, idx) => {
        const button = document.createElement("button");
        button.innerText = option;
        button.classList.add("btn");
        button.onclick = () => selectOption(button, idx, currentQ.answer);
        optionsBox.appendChild(button);
    });
}

function selectOption(selectedButton, selectedIdx, correctIdx) {
    const allButtons = document.getElementById("options-box").children;
    
    // Disable all options so they can't change their mind
    for (let btn of allButtons) {
        btn.disabled = true;
    }
    
    if (selectedIdx === correctIdx) {
        selectedButton.classList.add("correct");
        score++;
    } else {
        selectedButton.classList.add("wrong");
        allButtons[correctIdx].classList.add("correct"); // Highlight the right answer
    }
    
    document.getElementById("next-button").style.display = "block";
}

function nextQuestion() {
    currentQuestionIndex++;
    if (currentQuestionIndex < sharedQuestions.length) {
        showQuestion();
    } else {
        showResults();
    }
}

function showResults() {
    document.getElementById("quiz-box").style.display = "none";
    document.getElementById("result-box").style.display = "block";
    
    const total = sharedQuestions.length || QUESTIONS_PER_TEST;
    const percentage = total ? Math.round((score / total) * 100) : 0;
    document.getElementById("final-score").innerText = percentage;
    
    const msgElement = document.getElementById("pass-fail-msg");
    if (percentage >= 80) { // Standard 80% passing mark
        msgElement.innerText = "Congratulations! You passed the practice exam.";
        msgElement.style.color = "var(--success)";
    } else {
        msgElement.innerText = "You did not pass. Keep studying the handbook!";
        msgElement.style.color = "var(--error)";
    }
}

// Determine last-modified for questions.json (server header when available, fallback to GitHub API and document.lastModified)
async function setLastModified() {
    const el = document.getElementById('last-modified');
    try {
        // Try HEAD request for questions.json
        let resp = await fetch('questions.json', { method: 'HEAD', cache: 'no-cache' });
        let lm = resp.headers.get('last-modified');

        // Fallback to GET if HEAD doesn't return header
        if (!lm) {
            try {
                resp = await fetch('questions.json', { cache: 'no-cache' });
                lm = resp.headers.get('last-modified');
            } catch (e) {
                // ignore
            }
        }

        // If still no header, try GitHub commits API to get latest commit for the file
        if (!lm) {
            try {
                const apiUrl = 'https://api.github.com/repos/balajipalakkattu/permit-quiz/commits?path=questions.json&per_page=1';
                const apiResp = await fetch(apiUrl);
                if (apiResp.ok) {
                    const commits = await apiResp.json();
                    if (Array.isArray(commits) && commits.length) {
                        lm = commits[0]?.commit?.committer?.date || commits[0]?.commit?.author?.date || null;
                    }
                }
            } catch (e) {
                // ignore
            }
        }

        // Final fallback
        if (!lm) lm = document.lastModified || null;

        if (lm) {
            const d = new Date(lm);
            el.innerText = isNaN(d.getTime()) ? lm : d.toLocaleString();
        } else {
            el.innerText = 'Unknown';
        }
    } catch (err) {
        console.error('Could not determine questions.json last modified time', err);
        el.innerText = document.lastModified || 'Unknown';
    }
}

// Start by loading questions.json
loadQuestionsAndStart();
// Populate last-modified footer immediately (independent of question loading)
setLastModified();
</script>

</body>
</html>
